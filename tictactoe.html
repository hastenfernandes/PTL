<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e8e8e8;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
      letter-spacing: 0.1em;
    }

    .status {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      padding: 0.75rem 2rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 8px;
      background: rgba(255, 255, 255, 0.1);
      padding: 12px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .cell {
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .cell:hover:not(.taken) {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.02);
    }

    .cell.x {
      color: #e94560;
      text-shadow: 0 0 20px rgba(233, 69, 96, 0.7);
    }

    .cell.o {
      color: #00d9ff;
      text-shadow: 0 0 20px rgba(0, 217, 255, 0.7);
    }

    .cell.winning {
      animation: winPulse 0.6s ease-in-out infinite alternate;
    }

    @keyframes winPulse {
      from {
        background: rgba(255, 255, 255, 0.1);
        transform: scale(1);
      }
      to {
        background: rgba(255, 255, 255, 0.25);
        transform: scale(1.05);
      }
    }

    .btn {
      margin-top: 2rem;
      padding: 1rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #e94560 0%, #c73e54 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(233, 69, 96, 0.6);
    }

    .btn:active {
      transform: translateY(0);
    }

    .score-board {
      display: flex;
      gap: 2rem;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
    }

    .score {
      padding: 0.5rem 1.5rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .score span {
      font-weight: bold;
    }

    .score.x-score span {
      color: #e94560;
    }

    .score.o-score span {
      color: #00d9ff;
    }

    .series-status {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      padding: 0.5rem 1.5rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .series-winner {
      font-size: 1.8rem;
      font-weight: bold;
      margin-top: 1rem;
      padding: 1rem 2rem;
      background: linear-gradient(135deg, #e94560 0%, #00d9ff 100%);
      border-radius: 50px;
      animation: winPulse 0.6s ease-in-out infinite alternate;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    .btn.secondary {
      background: linear-gradient(135deg, #4a4a6a 0%, #3a3a5a 100%);
      box-shadow: 0 4px 20px rgba(74, 74, 106, 0.4);
    }

    .btn.secondary:hover {
      box-shadow: 0 6px 30px rgba(74, 74, 106, 0.6);
    }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  
  <div class="score-board">
    <div class="score x-score">X: <span id="scoreX">0</span></div>
    <div class="score o-score">O: <span id="scoreO">0</span></div>
  </div>
  
  <div class="status" id="status">Player X's turn</div>
  
  <div class="series-status" id="seriesStatus">Game 1 of 5</div>
  
  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>
  
  <button class="btn" id="restartBtn">New Game</button>
  <button class="btn secondary" id="resetBtn">Reset Series</button>

  <script>
    const cells = document.querySelectorAll('.cell');
    const statusEl = document.getElementById('status');
    const seriesStatusEl = document.getElementById('seriesStatus');
    const restartBtn = document.getElementById('restartBtn');
    const resetBtn = document.getElementById('resetBtn');
    const scoreXEl = document.getElementById('scoreX');
    const scoreOEl = document.getElementById('scoreO');

    let board = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X';
    let gameActive = true;
    let scoreX = 0;
    let scoreO = 0;
    let gamesPlayed = 0;
    const maxGames = 5;
    let seriesWinner = null;

    const winningCombinations = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
      [0, 4, 8], [2, 4, 6]             // diagonals
    ];

    function checkWinner() {
      for (const combo of winningCombinations) {
        const [a, b, c] = combo;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return { winner: board[a], combo };
        }
      }
      if (!board.includes('')) {
        return { winner: 'draw', combo: [] };
      }
      return null;
    }

    function updateSeriesStatus() {
      if (seriesWinner) {
        seriesStatusEl.textContent = `🏆 ${seriesWinner} wins the series!`;
        seriesStatusEl.classList.add('series-winner');
      } else {
        seriesStatusEl.textContent = `Game ${gamesPlayed + 1} of ${maxGames}`;
        seriesStatusEl.classList.remove('series-winner');
      }
    }

    function checkSeriesWinner() {
      if (scoreX >= 3) {
        seriesWinner = 'Player X';
        statusEl.textContent = `🏆 Player X wins the series ${scoreX}-${scoreO}!`;
        return true;
      }
      if (scoreO >= 3) {
        seriesWinner = 'Player O';
        statusEl.textContent = `🏆 Player O wins the series ${scoreX}-${scoreO}!`;
        return true;
      }
      if (gamesPlayed >= maxGames) {
        if (scoreX > scoreO) {
          seriesWinner = 'Player X';
          statusEl.textContent = `🏆 Player X wins the series ${scoreX}-${scoreO}!`;
        } else if (scoreO > scoreX) {
          seriesWinner = 'Player O';
          statusEl.textContent = `🏆 Player O wins the series ${scoreX}-${scoreO}!`;
        } else {
          statusEl.textContent = "🏆 Series ended in a tie!";
        }
        return true;
      }
      return false;
    }

    function handleCellClick(e) {
      const cell = e.target;
      const index = parseInt(cell.dataset.index);

      if (board[index] || !gameActive || seriesWinner) return;

      board[index] = currentPlayer;
      cell.textContent = currentPlayer;
      cell.classList.add(currentPlayer.toLowerCase(), 'taken');

      const result = checkWinner();
      
      if (result) {
        gameActive = false;
        gamesPlayed++;
        
        if (result.winner === 'draw') {
          statusEl.textContent = "It's a draw!";
        } else {
          statusEl.textContent = `Player ${result.winner} wins!`;
          result.combo.forEach(i => cells[i].classList.add('winning'));
          if (result.winner === 'X') {
            scoreX++;
            scoreXEl.textContent = scoreX;
          } else {
            scoreO++;
            scoreOEl.textContent = scoreO;
          }
        }
        
        checkSeriesWinner();
        updateSeriesStatus();
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        statusEl.textContent = `Player ${currentPlayer}'s turn`;
      }
    }

    function restartGame() {
      if (seriesWinner) return;
      
      board = ['', '', '', '', '', '', '', '', ''];
      currentPlayer = 'X';
      gameActive = true;
      statusEl.textContent = "Player X's turn";
      
      cells.forEach(cell => {
        cell.textContent = '';
        cell.className = 'cell';
      });
    }

    function resetSeries() {
      board = ['', '', '', '', '', '', '', '', ''];
      currentPlayer = 'X';
      gameActive = true;
      scoreX = 0;
      scoreO = 0;
      gamesPlayed = 0;
      seriesWinner = null;
      
      scoreXEl.textContent = 0;
      scoreOEl.textContent = 0;
      statusEl.textContent = "Player X's turn";
      updateSeriesStatus();
      seriesStatusEl.classList.remove('series-winner');
      
      cells.forEach(cell => {
        cell.textContent = '';
        cell.className = 'cell';
      });
    }

    cells.forEach(cell => cell.addEventListener('click', handleCellClick));
    restartBtn.addEventListener('click', restartGame);
    resetBtn.addEventListener('click', resetSeries);
  </script>
</body>
</html>
